version: '3.8'

services:
  flooring-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: upstairs-flooring-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=8080
      - DATA_DIR=/app/data
    security_opt:
      - no-new-privileges:true
    user: "1000:1000"
