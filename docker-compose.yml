version: '3.8'

services:
  flooring-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: upstairs-flooring-app
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      - NODE_ENV=production
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETGID
      - SETUID
